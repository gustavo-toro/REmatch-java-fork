name: Release
on:
  workflow_dispatch:
    inputs:
      version:
        required: true
        type: string

jobs:
  build:
    name: Build ${{ matrix.classifier }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            classifier: windows-x86_64

          - os: ubuntu-latest
            classifier: linux-x86_64

          - os: macos-latest
            classifier: macosx-x86_64

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: oracle
          java-version: '26'
          cache: maven

      - name: Resolve Maven dependencies
        run: mvn dependency:resolve

      - name: Configure CMake
        run: cmake -Snative -Bbuild -DBUILD_SHARED_LIBS=ON -DCMAKE_BUILD_TYPE=Release

      - name: Build CMake
        run: cmake --build build --config Release

      - name: Show directory tree
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          find build -print

      - name: Import GPG key
        shell: bash
        run: |
          echo "${{ secrets.MAVEN_GPG_PRIVATE_KEY }}" | base64 --decode | gpg --batch --import

      - name: Build
        run: mvn --batch-mode clean verify
        env:
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}

      - name: Prepare platform artifact
        if: matrix.classifier == 'linux-x86_64'
        run: mvn -f pom-platform.xml verify

      - name: Upload common artifacts
        if: matrix.classifier == 'linux-x86_64'
        uses: actions/upload-artifact@v7
        with:
          name: bundle
          path: |
            target/rematch-${{ inputs.version }}-javadoc.jar*
            target/rematch-${{ inputs.version }}-sources.jar*
            target/rematch-${{ inputs.version }}-javadoc.jar*
            target/rematch-${{ inputs.version }}.jar*
            target/rematch-${{ inputs.version }}.pom*
            target/rematch-platform-${{ inputs.version }}.pom*

      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: bundle
          path: |
            target/rematch-${{ inputs.version }}-${{ matrix.classifier }}.jar*

  publish:
    name: Publish to Maven Central
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Download artifacts
        uses: actions/download-artifact@v7
        with:
          name: bundle

      - name: List artifacts
        shell: bash
        run: |
          find bundle -type f | sort

      - name: Prepare bundle
        run: |
          mkdir -p cl/rematch/0.1.0
          cp bundle/* cl/rematch/0.1.0
          zip -r central-bundle.zip cl

      - name: Publish
        # run: mvn deploy
        run: unzip -l central-bundle.zip
